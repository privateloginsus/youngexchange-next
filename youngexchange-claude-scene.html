<style>
:root{color-scheme:dark;--em:#19e68c;--em2:#0fa968;--ink:#eafff4;--mute:rgba(220,245,232,.62);--line:rgba(60,255,160,.38);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;background:#010604;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.page{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:0 clamp(16px,4vw,64px)}
header{display:flex;align-items:center;justify-content:space-between;height:clamp(56px,9vh,84px);flex:none}
.logo{display:flex;align-items:center;gap:10px;font-size:clamp(19px,2.1vw,27px);font-weight:600;letter-spacing:-.02em;text-decoration:none;color:#fff}
.logo svg{width:clamp(28px,2.8vw,38px);height:auto;filter:drop-shadow(0 0 10px rgba(25,230,140,.6))}
.logo b{color:var(--em);font-weight:600}

nav a:hover{color:var(--em)}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
#stage{flex:1;min-height:150px;width:100%}
.card{position:relative;width:clamp(296px,90vw,396px);padding:clamp(18px,3vh,28px) clamp(20px,2.4vw,30px) clamp(16px,2.4vh,22px);border-radius:24px;background:linear-gradient(160deg,rgba(8,40,28,.62),rgba(2,14,10,.72));border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 0 0 1px rgba(25,230,140,.07) inset,0 1px 0 rgba(180,255,220,.18) inset,0 0 38px rgba(25,230,140,.22),0 30px 60px rgba(0,0,0,.55)}

h1{margin:0;text-align:center;font-size:clamp(19px,2.3vh + 4px,24px);font-weight:600;letter-spacing:-.02em}

label{display:block;font-size:12px;font-weight:500;margin:0 0 6px;color:rgba(235,255,245,.86)}
.field{position:relative;margin-bottom:clamp(10px,1.8vh,15px)}
input{width:100%;height:clamp(38px,5.4vh,44px);padding:0 14px;border-radius:12px;border:1px solid rgba(90,255,180,.28);background:rgba(0,10,6,.55);color:#fff;font:400 14px Inter,system-ui,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}

.eye{position:absolute;right:6px;bottom:3px;width:36px;height:36px;border:0;background:none;color:var(--mute);cursor:pointer;border-radius:8px}
.eye:focus-visible,.forgot:focus-visible,.alt a:focus-visible,.btn:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.forgot{display:block;text-align:right;font-size:12px;color:var(--em);text-decoration:none;margin:-4px 0 clamp(12px,2vh,18px)}
.forgot:hover{text-decoration:underline}
.btn{width:100%;height:clamp(40px,5.6vh,46px);border:0;border-radius:12px;cursor:pointer;font:600 14.5px Inter,system-ui,sans-serif;color:#021a10;letter-spacing:.01em;background:linear-gradient(180deg,#46f0aa 0%,#14c97c 55%,#0c9a5c 100%);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 0 26px rgba(25,230,140,.45),0 8px 18px rgba(0,0,0,.4);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 0 36px rgba(25,230,140,.65),0 10px 22px rgba(0,0,0,.4)}
.alt{margin:clamp(10px,1.8vh,15px) 0 0;text-align:center;font-size:12px;color:var(--mute)}

.feats span:first-child{padding-left:0;border-left:0}

header{height:clamp(48px,7.5vh,68px)}
footer{justify-content:center;min-height:clamp(28px,4.6vh,42px)}
.copy{max-width:none;text-align:center}

@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}

.card::after{content:"";position:absolute;top:0;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,rgba(180,255,220,.9),transparent);pointer-events:none}

.sub{margin:4px 0 clamp(12px,2vh,18px)}
.sub strong{display:block;font-weight:500;font-size:14px;color:var(--em);margin-bottom:2px}
.sub span{display:block}
.fld{position:relative;margin-bottom:clamp(9px,1.5vh,12px)}

      </div>
    </section>
  </main>
  <footer>
    <div class="copy">© 2026 YoungExchange</div>
  </footer>
</div>
