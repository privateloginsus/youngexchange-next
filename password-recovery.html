<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07110f">
  <title>Recupera la password | YoungExchange</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="password-recovery.css?v=2">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <iframe class="ye-claude-scene" src="youngexchange-claude-scene.html?v=50" title="" aria-hidden="true" tabindex="-1" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;pointer-events:none;background:#010806"></iframe>
  <main class="recovery-page">
    <section class="recovery-card" aria-labelledby="recoveryTitle">
      <a class="recovery-brand" href="index.html">
        <span class="brandmark">Y</span>
        <span>young<span class="accent">exchange</span></span>
      </a>
      <p class="recovery-kicker">YOUNGEXCHANGE</p>
      <h1 id="recoveryTitle">Recupera la tua password</h1>
      <p>Inserisci l'indirizzo email associato al tuo account YoungExchange per ricevere il link di reimpostazione.</p>
      <form id="recoveryForm" novalidate>
        <label for="recoveryEmail">Indirizzo email</label>
        <input id="recoveryEmail" type="email" autocomplete="email" placeholder="nome@esempio.it" required>
        <button class="primary full" type="submit">Invia link di recupero <span>↗</span></button>
      </form>
      <p id="recoveryMessage" class="recovery-message" role="status" aria-live="polite"></p>
      <a class="recovery-link" href="index.html">← Torna al login</a>
      <p class="recovery-security">♢ La richiesta utilizza Supabase Auth. Per la tua sicurezza, non confermiamo se un indirizzo è registrato.</p>
    </section>
  </main>
  <script src="config.production.js?v=20261117-public-production-3"></script>
  <script src="config-selector.js?v=20261117-recovery-2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="password-recovery.js?v=20261117-recovery"></script>
</body>
</html>
