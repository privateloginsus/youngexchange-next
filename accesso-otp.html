<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YoungExchange — Accesso email OTP</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#07110f;color:#e6fff5}main{width:min(440px,94vw);padding:30px;border:1px solid #295546;border-radius:18px;background:#10241c}input,button{width:100%;padding:13px;margin:9px 0;border-radius:8px}button{background:#31dca3;color:#08221a;font-weight:700}p{line-height:1.5}</style></head><body><main><h1>YoungExchange</h1><h2>Verifica email e accesso OTP</h2><p>Usa l'email del conto creato dall'amministratore. Riceverai un codice monouso: nessun invito è necessario.</p><form id="request"><label>Email<input id="email" type="email" required autocomplete="email"></label><button>Richiedi codice OTP</button></form><form id="verify" hidden><label>Codice ricevuto<input id="token" inputmode="numeric" autocomplete="one-time-code" required pattern="[0-9]{6,8}"></label><button>Verifica e accedi</button></form><p id="status" role="status"></p><p><a href="index.html">Torna al sito</a></p></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const c=window.YEX_CONFIG,client=window.supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),status=document.querySelector('#status');let email='';
document.querySelector('#request').onsubmit=async e=>{e.preventDefault();email=document.querySelector('#email').value.trim().toLowerCase();const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;status.textContent='Se il conto esiste, controlla la tua email per il codice OTP.';document.querySelector('#verify').hidden=false}catch(err){status.textContent='Richiesta non riuscita: '+err.message}finally{b.disabled=false}};
document.querySelector('#verify').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await client.auth.verifyOtp({email,token:document.querySelector('#token').value.trim(),type:'email'});if(error)throw error;location.replace('index.html')}catch(err){status.textContent='Verifica non riuscita: '+err.message}finally{b.disabled=false}};
</script></body></html>
